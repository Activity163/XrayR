name: Test and validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*' -not -path './.claude/*'))"
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: Shellcheck
        run: shellcheck -S warning release/*.sh
      - name: Build
        run: go build ./...
      - name: Validate configuration templates
        run: |
          go run . config check -c release/config/config.minimal.yml
          go run . config check -c release/config/config.yml.example
          go run . config check -c release/config/config.full.yml
      - name: Validate the routing template against real rule data
        run: |
          bash release/download-rules-dat.sh ./rules
          RULES_DAT_DIR="$PWD/rules" go test ./panel/ -run TestRuleDataLoads -v

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
      - name: Compile integration tests
        run: go test -run '^$' -tags=integration ./...
