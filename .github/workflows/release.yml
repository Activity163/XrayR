name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/*.yml"
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/*.yml"
  release:
    types: [ published ]

permissions:
  contents: write

jobs:

  build:
    strategy:
      # Linux only. install.sh is the supported way to deploy and it maps exactly
      # these architectures to release assets, so build the ones it can fetch
      # rather than a dozen nobody downloads. Adding a target here means adding its
      # friendly name to .github/build/friendly-filenames.json and its ASSET to
      # release/install.sh in the same change.
      matrix:
        include:
          # linux-64
          - goos: linux
            goarch: amd64
          # linux-32
          - goos: linux
            goarch: 386
          # linux-arm64-v8a
          - goos: linux
            goarch: arm64
          # linux-arm32-v7a
          - goos: linux
            goarch: arm
            goarm: 7
          # linux-arm32-v6
          - goos: linux
            goarch: arm
            goarm: 6
          # linux-arm32-v5
          - goos: linux
            goarch: arm
            goarm: 5
          # linux-riscv64
          - goos: linux
            goarch: riscv64
          # linux-s390x
          - goos: linux
            goarch: s390x
          # linux-ppc64le
          - goos: linux
            goarch: ppc64le
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"

      - name: Get project dependencies
        run: go mod download


      - name: Build XrayR
        run: |
          mkdir -p build_assets
          go build -v -o build_assets/XrayR -trimpath -ldflags "-s -w -buildid="

      - name: Prepare to release
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 60
          retry_wait_seconds: 60
          max_attempts: 5
          command: |
            cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
            cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
            cp ${GITHUB_WORKSPACE}/release/config/dns.json ./build_assets/dns.json
            cp ${GITHUB_WORKSPACE}/release/config/route.json ./build_assets/route.json
            cp ${GITHUB_WORKSPACE}/release/config/custom_outbound.json ./build_assets/custom_outbound.json
            cp ${GITHUB_WORKSPACE}/release/config/custom_inbound.json ./build_assets/custom_inbound.json
            cp ${GITHUB_WORKSPACE}/release/config/rulelist ./build_assets/rulelist
            cp ${GITHUB_WORKSPACE}/release/config/config.yml.example ./build_assets/config.yml
            cp ${GITHUB_WORKSPACE}/release/config/config.minimal.yml ./build_assets/config.minimal.yml
            cp ${GITHUB_WORKSPACE}/release/config/config.full.yml ./build_assets/config.full.yml
            cp ${GITHUB_WORKSPACE}/release/config/config.template.yml ./build_assets/config.template.yml
            cp ${GITHUB_WORKSPACE}/release/install.sh ./build_assets/install.sh
            cp ${GITHUB_WORKSPACE}/release/download-rules-dat.sh ./build_assets/download-rules-dat.sh
            bash ${GITHUB_WORKSPACE}/release/download-rules-dat.sh ./build_assets
      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../XrayR-$ASSET_NAME.zip .
          popd || exit 1
          FILE=./XrayR-$ASSET_NAME.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
      - name: Change the name
        run: |
          mv build_assets XrayR-$ASSET_NAME
      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XrayR-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            ./XrayR-${{ steps.get_filename.outputs.ASSET_NAME }}/*
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./XrayR-${{ steps.get_filename.outputs.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true
